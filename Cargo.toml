[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.dependencies]
wolf-amqp-codec = { path = "crates/wolf-amqp-codec" }
wolf-stream-codec = { path = "crates/wolf-stream-codec" }
wolf-storage = { path = "crates/wolf-storage" }
wolf-broker = { path = "crates/wolf-broker" }
bytes = "1"
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
