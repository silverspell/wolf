validation:
  mode: devcontainer
  commands:
    - name: fmt
      run: cargo fmt --all --check
    - name: clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: test
      run: cargo test --workspace
  timeoutSeconds: 1800
security:
  scan:
    rules: .devcontainer/loopflow/semgrep/rules
agent:
  testCommands:
    forbidden:
      - "*cargo test"
      - "*cargo test --workspace*"
    focused:
      - "*cargo test * --*"
