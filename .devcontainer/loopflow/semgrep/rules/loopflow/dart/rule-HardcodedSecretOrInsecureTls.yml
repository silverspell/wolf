rules:
  - id: loopflow-dart-hardcoded-secret-or-insecure-tls
    languages:
      - dart
    severity: ERROR
    message: >-
      Hardcoded credentials can leak secrets, and accepting any TLS certificate
      disables certificate validation. Load secrets from a secure store and
      validate certificates properly.
    metadata:
      author: "LoopFlow"
      license: "MIT"
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      source: https://github.com/silverspell/LoopFlow-BE
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: var $VAR = "...";
              - pattern: final $VAR = "...";
              - pattern: const $VAR = "...";
              - pattern: String $VAR = "...";
              - pattern: final String $VAR = "...";
              - pattern: const String $VAR = "...";
              - pattern: $VAR = "...";
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i)^.*(password|passwd|secret|token|api_?key|access_?key|private_?key).*$
      - pattern: $CLIENT.badCertificateCallback = (...) => true
      - pattern: $CLIENT.badCertificateCallback = ($A, $B, $C) => true
