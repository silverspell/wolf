rules:
  - id: loopflow-typescript-hardcoded-secret-or-insecure-tls
    languages:
      - typescript
    severity: ERROR
    message: >-
      Hardcoded credentials can leak secrets, and disabling TLS certificate
      validation allows man-in-the-middle attacks. Load secrets from a secure
      store and validate certificates properly.
    metadata:
      author: "LoopFlow"
      license: "MIT"
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      source: https://github.com/silverspell/LoopFlow-BE
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: const $VAR = $VALUE;
              - pattern: 'const $VAR: $T = $VALUE;'
              - pattern: let $VAR = $VALUE;
              - pattern: 'let $VAR: $T = $VALUE;'
              - pattern: var $VAR = $VALUE;
              - pattern: 'var $VAR: $T = $VALUE;'
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i)^.*(password|passwd|secret|token|api_?key|access_?key|private_?key).*$
          # A secret is a single string literal of at least 8 characters with no
          # whitespace; UI messages and labels whose name mentions a password are not.
          - metavariable-regex:
              metavariable: $VALUE
              regex: ^["'][^\s"']{8,}["']$
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0";
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0;
      - pattern: $OPTIONS.rejectUnauthorized = false;
      - pattern: $OPTIONS.strictSSL = false;
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: '{..., strictSSL: false, ...}'
