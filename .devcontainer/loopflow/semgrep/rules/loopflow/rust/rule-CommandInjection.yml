rules:
  - id: loopflow-rust-command-injection
    languages:
      - rust
    severity: ERROR
    message: >-
      Spawning a process with a non-constant executable can allow OS command
      injection. Pass a fixed, validated executable and avoid shell execution.
    metadata:
      author: "LoopFlow"
      license: "MIT"
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      source: https://github.com/silverspell/LoopFlow-BE
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: Command::new($CMD)
                  - pattern: std::process::Command::new($CMD)
              - pattern-not: Command::new("...")
              - pattern-not: std::process::Command::new("...")
          - pattern: Command::new("sh").arg("-c").arg($CMD)
          - pattern: Command::new("bash").arg("-c").arg($CMD)
